<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141a18"><meta name="description" content="Sesin ritminde, kelime kelime. Kitaplarını Android cihazında çevrimdışı dinle ve oku."><meta name="google" content="notranslate"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="reader.css"><title>Smart Podcast · Cep Okuyucu</title><script src="i18n.js" defer></script><script src="core.js" defer></script><script src="reader.js" defer></script></head>
<body>
<main id="library" class="shell">
 <header class="brand"><span class="brand-icon" aria-hidden="true">ııı</span><div>SMART PODCAST<small data-i18n="tagline">CEP OKUYUCU</small></div><button id="install" class="subtle" hidden data-i18n="install">Yükle ↗</button><button id="language" class="lang-toggle" data-i18n="langButton" data-i18n-aria="langAria">DE</button></header>
 <section class="intro"><p class="eyebrow" data-i18n="eyebrow">KENDİ RİTMİNDE</p><h1 data-i18n-html="headline">Dinle.<br><span>Kelime kelime.</span></h1><p data-i18n-html="intro">Sesin ve metnin aynı yerde.<br>Kitapların her zaman yanında.</p></section>
 <div class="library-heading"><h2><span data-i18n="library">Kitaplığım</span> <span id="bookCount">0</span></h2><label class="button accent" for="packages" data-i18n="addBook">＋ Kitap ekle</label><input id="packages" type="file" accept=".smartpodcast,.zip,application/zip,application/octet-stream" multiple hidden></div>
 <p id="importStatus" role="status" aria-live="polite"></p><div id="books"></div>
 <section id="empty" class="empty"><span aria-hidden="true">≋</span><h3 data-i18n="emptyTitle">İlk kitabına yer aç.</h3><p data-i18n-html="emptyText"></p></section>
 <footer><span id="offlineStatus"></span><p data-i18n="storageNote"></p><button id="help" class="subtle" data-i18n="help">Nasıl kullanırım?</button><small id="appVersion" class="app-version"></small></footer>
</main>
<main id="reader" class="reader" hidden>
 <header class="reader-header"><button id="back" class="icon-button" data-i18n-aria="back">‹</button><div><p id="bookTitle"></p><span id="sliceTitle"></span></div><button id="settingsButton" class="icon-button" data-i18n-aria="settings">☷</button></header>
 <div id="wordStage" class="word-stage"><div id="word" lang="de"></div></div>
 <section id="paragraphPanel" class="paragraph-panel" hidden><label for="sectionPicker" data-i18n="section">Bölüm</label><select id="sectionPicker"></select><div id="paragraph"></div></section>
 <div class="reader-controls"><p id="chapterTitle"></p><input id="seek" type="range" min="0" max="1" value="0" step="0.01" data-i18n-aria="seekAria"><div class="time-row"><span id="elapsed">00:00</span><span id="remaining"></span></div><div class="transport"><div class="skip-group"><button id="rewind" class="skip">↶</button><button id="stepBack" class="step"></button></div><button id="play" class="play">▶</button><div class="skip-group"><button id="forward" class="skip">↷</button><button id="stepForward" class="step"></button></div></div><div class="reader-bottom"><label class="rate-label"><select id="rate" data-i18n-aria="rateAria"><option value="0.75">0,75×</option><option value="1">1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="1.75">1,75×</option><option value="2">2×</option></select></label><button id="sleepButton" class="sleep-button" data-i18n-aria="sleep">☾</button><button id="paragraphToggle" class="subtle"></button></div><p id="playerStatus" role="status" aria-live="polite"></p></div>
 <p id="sleepBadge" class="sleep-badge" aria-hidden="true"></p>
 <div id="focusProgress" class="focus-progress" aria-hidden="true"><span></span></div>
</main>
<dialog id="settings"><form method="dialog"><header><h2 data-i18n="settings">Okuma ayarları</h2><button class="icon-button" data-i18n-aria="close">×</button></header><label><span data-i18n="language">Arayüz dili</span><select id="languageSelect"><option value="tr">Türkçe</option><option value="de">Deutsch</option></select></label><label><span data-i18n="fontSize">Yazı boyutu</span><input id="fontSize" type="range" min="30" max="100" step="2" value="64"></label><label><span data-i18n="view">Görünüm</span><select id="theme"><option value="dark" data-i18n="dark">Koyu</option><option value="paper" data-i18n="paper">Kâğıt</option></select></label><label class="check"><input id="keepAwake" type="checkbox" checked><span data-i18n="keepAwake">Ekranı açık tut</span></label><label><span data-i18n="brightness">Okuma alanı parlaklığı</span><input id="brightness" type="range" min="45" max="100" value="100"></label><p data-i18n="settingsNote"></p><button class="button accent" data-i18n="ok">Tamam</button></form></dialog>
<dialog id="sleepDialog"><form method="dialog"><header><h2 data-i18n="sleep">Uyku zamanlayıcısı</h2><button class="icon-button" data-i18n-aria="close">×</button></header><div id="sleepOptions" class="sleep-options"></div><p data-i18n="sleepNote"></p></form></dialog>
<dialog id="helpDialog"><form method="dialog"><header><h2 data-i18n="helpTitle">Cebindeki okuyucu</h2><button class="icon-button" data-i18n-aria="close">×</button></header><ol><li data-i18n-html="help1"></li><li data-i18n-html="help2"></li><li data-i18n-html="help3"></li></ol><p data-i18n="helpTap"></p><p data-i18n-html="helpInstall"></p><button class="button accent" data-i18n="gotIt">Anladım</button></form></dialog>
<audio id="audio" preload="metadata"></audio>
</body></html>
